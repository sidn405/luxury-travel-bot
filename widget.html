<!-- Eco Friendly Luxury Travels Chat Widget -->
<style>
#eco-chat-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: linear-gradient(135deg, #004444 0%, #006666 100%);
    border: 3px solid #FFD700;
    box-shadow: 0 4px 20px rgba(0,68,68,0.4);
    cursor: pointer;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    transition: all 0.3s ease;
}

#eco-chat-button:hover {
    transform: scale(1.15);
    box-shadow: 0 6px 30px rgba(0,68,68,0.6);
}

#eco-chat-container {
    position: fixed;
    bottom: 100px;
    right: 20px;
    width: 420px;
    height: 650px;
    border-radius: 20px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.4);
    z-index: 9999;
    display: none;
    overflow: hidden;
    background: white;
    border: 3px solid #004444;
}

#eco-chat-container.open {
    display: block;
    animation: slideUp 0.4s ease;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

#eco-chat-header {
    background: linear-gradient(135deg, #004444 0%, #006666 100%);
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #FFD700;
}

#eco-chat-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    transition: all 0.3s ease;
}

#eco-chat-close:hover {
    background: #FFD700;
    color: #004444;
    transform: rotate(90deg);
}

#eco-chat-iframe {
    width: 100%;
    height: calc(100% - 75px);
    border: none;
}

@media (max-width: 768px) {
    #eco-chat-container {
        width: 100%;
        height: 100%;
        bottom: 0;
        right: 0;
        border-radius: 0;
    }
    #eco-chat-button {
        width: 60px;
        height: 60px;
    }
}
</style>

<button id="eco-chat-button" onclick="ecoToggleChat()" title="Chat with Dave">🌿</button>

<div id="eco-chat-container">
    <div id="eco-chat-header">
        <div>
            <h3 style="margin:0;font-size:17px;">🌿 Eco Friendly Luxury Travels</h3>
            <p style="margin:0;font-size:12px;opacity:0.9;">AI-Powered Travel Planning</p>
        </div>
        <button id="eco-chat-close" onclick="ecoToggleChat()">×</button>
    </div>
    <iframe 
        id="eco-chat-iframe"
        src="https://luxury-travel-bot-production.up.railway.app"
        title="Travel Chat">
    </iframe>
</div>

<script>
function ecoToggleChat() {
    var container = document.getElementById('eco-chat-container');
    container.classList.toggle('open');
}
</script>
