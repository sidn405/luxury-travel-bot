<body>
    <div class="flight-search-widget">
        <div class="widget-header">
            <h2>✈️ Private Jet Charter Search</h2>
            <p>Find the perfect aircraft for your journey</p>
        </div>
        
        <!-- Empty Leg Deals Banner -->
        <div class="empty-legs-banner" onclick="searchEmptyLegs()">
            🎯 Click here for EMPTY LEG DEALS - Save up to 75%!
        </div>
        
        <form class="search-form" onsubmit="searchFlights(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="origin">✈️ Departure From</label>
                    <input 
                        type="text" 
                        id="origin" 
                        name="origin" 
                        placeholder="Miami, New York, Los Angeles..."
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="destination">📍 Flying To</label>
                    <input 
                        type="text" 
                        id="destination" 
                        name="destination" 
                        placeholder="Aspen, Dubai, Bali..."
                        required
                    >
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="departure_date">📅 Departure Date</label>
                    <input 
                        type="date" 
                        id="departure_date" 
                        name="departure_date"
                        min="<?php echo date('Y-m-d'); ?>"
                    >
                </div>
                
                <div class="form-group">
                    <label for="passengers">👥 Passengers</label>
                    <select id="passengers" name="passengers">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="4" selected>4 Passengers</option>
                        <option value="6">6 Passengers</option>
                        <option value="8">8 Passengers</option>
                        <option value="10">10 Passengers</option>
                        <option value="12">12 Passengers</option>
                        <option value="16">16+ Passengers</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="aircraft_type">🛩️ Preferred Aircraft Type (Optional)</label>
                <select id="aircraft_type" name="aircraft_type">
                    <option value="">Any Aircraft</option>
                    <option value="Light Jet">Light Jet (4-7 passengers)</option>
                    <option value="Midsize Jet">Midsize Jet (7-9 passengers)</option>

            </button>

            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        // Replace this with your actual API endpoint
        const API_ENDPOINT = '/api/flights/search';
        
        async function searchFlights(event) {
            event.preventDefault();
            
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Searching available jets...</div>';
            resultsContainer.classList.add('visible');
            
            const formData = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                departure_date: document.getElementById('departure_date').value,
                passengers: parseInt(document.getElementById('passengers').value),
                aircraft_type: document.getElementById('aircraft_type').value || null
            };
            
            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) {
                    throw new Error('Search failed');
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3 style="color: #ff4444;">⚠️ Search Error</h3>
                        <p>Unable to complete search. Please contact us directly.</p>
                        <a href="${data.affiliate_link || '#'}" class="book-now-button">
                            Contact Villers Jets
                        </a>
                    </div>
                `;
            }
        }
        
        function displayResults(data) {
            const resultsContainer = document.getElementById('results');
            
            if (!data.flights || data.flights.length === 0) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3>No Exact Matches Found</h3>
                        <p>Contact our partner Villers Jets for personalized quotes</p>
                        <a href="${data.affiliate_link}" class="book-now-button" target="_blank">
                            Get Custom Quote from Villers Jets
                        </a>
                    </div>
                `;
                return;
            }
            
            let html = `
                <h2 style="margin-top: 0; color: #004444;">
                    Available Jets: ${data.origin} → ${data.destination}
                </h2>
            `;
            
            data.flights.forEach((flight, index) => {
                const price = flight.price > 0 
                    ? `$${flight.price.toLocaleString()}` 
                    : 'Call for Quote';
                
                html += `
                    <div class="flight-option">
                        <h3>${flight.aircraft}</h3>
                        <div class="flight-details">
                            <div class="detail-item">
                                <div class="detail-label">Type</div>
                                <div class="detail-value">${flight.aircraft_type}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Passengers</div>
                                <div class="detail-value">Up to ${flight.passengers}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Price</div>
                                <div class="detail-value">${price}</div>
                            </div>
                        </div>
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e0e0e0;">
                            <strong>Operator:</strong> ${flight.operator}<br>
                            <strong>Flight Time:</strong> ${flight.flight_time}
                        </div>
                        <button class="book-now-button" onclick="bookFlight('${data.affiliate_link}', '${flight.aircraft}')">
                            Book This Jet with Villers Jets →
                        </button>
                    </div>
                `;
            });
            
            resultsContainer.innerHTML = html;
        }
        
        function bookFlight(affiliateLink, aircraftName) {
            // Track conversion
            if (typeof gtag !== 'undefined') {
                gtag('event', 'flight_booking_click', {
                    'aircraft': aircraftName,
                    'event_category': 'private_jets',
                    'event_label': aircraftName
                });
            }
            
            // Redirect to Villers Jets
            window.open(affiliateLink, '_blank');
        }
        
        async function searchEmptyLegs() {
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Loading empty leg deals...</div>';
            resultsContainer.classList.add('visible');
            
            try {
                const response = await fetch('/api/flights/empty-legs');
                const data = await response.json();
                
                if (data.empty_legs && data.empty_legs.length > 0) {
                    let html = '<h2 style="color: #004444;">🎯 Current Empty Leg Deals</h2>';
                    
                    data.empty_legs.forEach(deal => {
                        const savings = deal.savings > 0 ? `Save ${deal.savings}%` : '';
                        html += `
                            <div class="flight-option">
                                <h3>${deal.route}</h3>
                                <div class="flight-details">
                                    <div class="detail-item">
                                        <div class="detail-label">Date</div>
                                        <div class="detail-value">${deal.date}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Aircraft</div>
                                        <div class="detail-value">${deal.aircraft}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Price</div>
                                        <div class="detail-value">$${deal.price.toLocaleString()}</div>
                                    </div>
                                </div>
                                ${savings ? `<div style="text-align: center; color: #ff6600; font-weight: 600; margin: 10px 0;">${savings}</div>` : ''}
                                <button class="book-now-button" onclick="bookFlight('${data.affiliate_link}', 'Empty Leg')">
                                    Book This Deal →
                                </button>
                            </div>
                        `;
                    });
                    
                    resultsContainer.innerHTML = html;
                } else {
                    resultsContainer.innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <h3>No Empty Legs Available Right Now</h3>
                            <p>Check back soon or contact Villers Jets for other opportunities</p>
                            <a href="${data.affiliate_link}" class="book-now-button" target="_blank">
                                Contact Villers Jets
                            </a>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <p>Unable to load empty leg deals</p>
                        <a href="#" class="book-now-button">Contact Us</a>
                    </div>
                `;
            }
        }
        
        // Set minimum date to today
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('departure_date').setAttribute('min', today);
        });
    </script>
</body>
