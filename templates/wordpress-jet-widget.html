<!-- 
UPDATED WORDPRESS WIDGET - WITH ONE-WAY & ROUND-TRIP OPTIONS
Replace your current Custom HTML block with this version
-->

<!-- ========== STYLES ========== -->
<style>
.jet-widget {
    max-width: 800px;
    margin: 40px auto;
    padding: 30px;
    background: linear-gradient(135deg, #0d5f5f 0%, #0a7a7a 100%);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.jet-widget h2 {
    text-align: center;
    font-size: 2em;
    margin: 0 0 10px 0;
}

.jet-widget p {
    text-align: center;
    margin: 0 0 30px 0;
    opacity: 0.9;
}

/* ✅ NEW: Trip Type Selector */
.trip-type-selector {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 25px;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 10px;
}

.trip-type-option {
    flex: 1;
    max-width: 200px;
}

.trip-type-option input[type="radio"] {
    display: none;
}

.trip-type-option label {
    display: block;
    padding: 12px 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
}

.trip-type-option input[type="radio"]:checked + label {
    background: #FFD700;
    color: #0a7a7a;
    box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
}

.trip-type-option label:hover {
    background: rgba(255,255,255,0.3);
}

.jet-form {
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 15px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.jet-field {
    margin-bottom: 20px;
}

.jet-field label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.jet-field input,
.jet-field select {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    box-sizing: border-box;
}

/* ✅ NEW: Return date field (hidden by default) */
.return-date-field {
    display: none;
}

.return-date-field.visible {
    display: block;
}

.jet-btn {
    width: 100%;
    padding: 15px;
    background: #FFD700;
    color: #004444;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.jet-btn:hover {
    background: #FFC700;
    transform: translateY(-2px);
}

.jet-results {
    margin-top: 30px;
    padding: 25px;
    background: white;
    border-radius: 15px;
    color: #333;
    display: none;
}

.jet-flight {
    padding: 15px;
    margin: 15px 0;
    background: #f8f9fa;
    border-radius: 8px;
    border-left: 4px solid #0d5f5f;
}

/* ✅ NEW: Flight direction headers */
.flight-direction {
    background: #0d5f5f;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    margin: 25px 0 15px 0;
    font-weight: 600;
    font-size: 1.1em;
}

.jet-link {
    display: inline-block;
    padding: 15px 30px;
    background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
    color: #1a1a1a !important;
    text-decoration: none;
    border-radius: 8px;
    margin-top: 15px;
    font-weight: 700;
    font-size: 1.1em;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
    transition: all 0.3s;
}

.jet-link:hover {
    background: linear-gradient(135deg, #f4d03f 0%, #d4af37 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
}

@media (max-width: 768px) {
    .jet-widget {
        margin: 20px 10px;
        padding: 20px;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .trip-type-selector {
        flex-direction: column;
    }
    
    .trip-type-option {
        max-width: 100%;
    }
}
</style>

<!-- ========== WIDGET HTML ========== -->
<div class="jet-widget">
    <h2>✈️ Private Jet Charter Search</h2>
    <p>Find the perfect aircraft for your journey</p>
    
    <!-- ✅ NEW: Trip Type Selector -->
    <div class="trip-type-selector">
        <div class="trip-type-option">
            <input type="radio" id="one-way" name="trip-type" value="one-way" checked>
            <label for="one-way">➡️ One-Way</label>
        </div>
        <div class="trip-type-option">
            <input type="radio" id="round-trip" name="trip-type" value="round-trip">
            <label for="round-trip">🔄 Round-Trip</label>
        </div>
    </div>
    
    <form class="jet-form" onsubmit="return searchJets(event)">
        <div class="form-row">
            <div class="jet-field">
                <label>✈️ Departure From</label>
                <input type="text" id="jet-origin" placeholder="Miami, New York, Los Angeles..." required>
            </div>
            
            <div class="jet-field">
                <label>📍 Flying To</label>
                <input type="text" id="jet-destination" placeholder="Aspen, Dubai, Bali..." required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="jet-field">
                <label>📅 Departure Date</label>
                <input type="date" id="jet-departure-date" required>
            </div>
            
            <!-- ✅ NEW: Return Date (shows only for round-trip) -->
            <div class="jet-field return-date-field" id="return-date-container">
                <label>📅 Return Date</label>
                <input type="date" id="jet-return-date">
            </div>
        </div>
        
        <div class="jet-field">
            <label>👥 Number of Passengers</label>
            <select id="jet-passengers">
                <option value="1">1 Passenger</option>
                <option value="2">2 Passengers</option>
                <option value="4" selected>4 Passengers</option>
                <option value="6">6 Passengers</option>
                <option value="8">8 Passengers</option>
                <option value="10">10+ Passengers</option>
            </select>
        </div>
        
        <button type="submit" class="jet-btn" id="search-btn">🔍 Search Available Jets</button>
    </form>
    
    <div id="jet-results" class="jet-results"></div>
</div>

<!-- ========== JAVASCRIPT ========== -->
<script>
// ⚠️ IMPORTANT: Update this URL to your Railway app
const JET_API_URL = 'https://luxury-travel-bot-production.up.railway.app/api/flights/search';

// ✅ NEW: Handle trip type changes
document.querySelectorAll('input[name="trip-type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        const returnDateContainer = document.getElementById('return-date-container');
        const returnDateInput = document.getElementById('jet-return-date');
        const searchBtn = document.getElementById('search-btn');
        
        if (this.value === 'round-trip') {
            returnDateContainer.classList.add('visible');
            returnDateInput.required = true;
            searchBtn.textContent = '🔍 Search Round-Trip Flights';
        } else {
            returnDateContainer.classList.remove('visible');
            returnDateInput.required = false;
            returnDateInput.value = '';
            searchBtn.textContent = '🔍 Search Available Jets';
        }
    });
});

async function searchJets(event) {
    event.preventDefault();
    
    // Get form values
    const tripType = document.querySelector('input[name="trip-type"]:checked').value;
    const origin = document.getElementById('jet-origin').value;
    const destination = document.getElementById('jet-destination').value;
    const departureDate = document.getElementById('jet-departure-date').value;
    const returnDate = document.getElementById('jet-return-date').value;
    const passengers = document.getElementById('jet-passengers').value;
    
    // Show loading
    const resultsDiv = document.getElementById('jet-results');
    resultsDiv.innerHTML = '<p style="text-align:center; padding: 20px;">✈️ Searching for available jets...</p>';
    resultsDiv.style.display = 'block';
    
    try {
        if (tripType === 'round-trip') {
            // ✅ NEW: Search both directions for round-trip
            await searchRoundTrip(origin, destination, departureDate, returnDate, passengers);
        } else {
            // One-way search
            await searchOneWay(origin, destination, departureDate, passengers);
        }
        
    } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = `
            <h3 style="color: #dc3545;">⚠️ Search Error</h3>
            <p>Unable to search flights at this time. Please contact us directly.</p>
            <a href="https://www.villiersjets.com/?id=7275" target="_blank" class="jet-link">
                Contact Villers Jets →
            </a>
        `;
    }
}

// ✅ NEW: One-way search
async function searchOneWay(origin, destination, date, passengers) {
    const response = await fetch(JET_API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            origin: origin,
            destination: destination,
            departure_date: date,
            passengers: parseInt(passengers)
        })
    });
    
    if (!response.ok) throw new Error('Search failed');
    
    const data = await response.json();
    displayOneWayResults(data);
}

// ✅ NEW: Round-trip search
async function searchRoundTrip(origin, destination, departureDate, returnDate, passengers) {
    // Search outbound flight
    const outboundResponse = await fetch(JET_API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            origin: origin,
            destination: destination,
            departure_date: departureDate,
            passengers: parseInt(passengers)
        })
    });
    
    // Search return flight
    const returnResponse = await fetch(JET_API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            origin: destination,  // Reversed
            destination: origin,  // Reversed
            departure_date: returnDate,
            passengers: parseInt(passengers)
        })
    });
    
    if (!outboundResponse.ok || !returnResponse.ok) {
        throw new Error('Search failed');
    }
    
    const outboundData = await outboundResponse.json();
    const returnData = await returnResponse.json();
    
    displayRoundTripResults(outboundData, returnData);
}

// ✅ NEW: Display one-way results
function displayOneWayResults(data) {
    const resultsDiv = document.getElementById('jet-results');
    
    if (!data.flights || data.flights.length === 0) {
        resultsDiv.innerHTML = `
            <h3>No Exact Matches Found</h3>
            <p>Contact Villers Jets for personalized quotes on this route.</p>
            <a href="${data.affiliate_link || 'https://www.villiersjets.com/?id=7275'}" 
               target="_blank" 
               class="jet-link">
                Get Custom Quote →
            </a>
        `;
        return;
    }
    
    let html = `
        <h3 style="margin-top: 0;">
            Available Jets: ${data.origin} → ${data.destination}
        </h3>
    `;
    
    html += formatFlights(data.flights);
    html += formatBookingLink(data.affiliate_link);
    
    resultsDiv.innerHTML = html;
}

// ✅ NEW: Display round-trip results
function displayRoundTripResults(outboundData, returnData) {
    const resultsDiv = document.getElementById('jet-results');
    
    let html = `
        <h3 style="margin-top: 0;">
            Round-Trip Flight Options
        </h3>
    `;
    
    // Outbound flights
    html += `<div class="flight-direction">
        ➡️ Outbound: ${outboundData.origin} → ${outboundData.destination}
    </div>`;
    
    if (outboundData.flights && outboundData.flights.length > 0) {
        html += formatFlights(outboundData.flights);
    } else {
        html += '<p>No outbound flights available. Contact Villers Jets for options.</p>';
    }
    
    // Return flights
    html += `<div class="flight-direction">
        ⬅️ Return: ${returnData.origin} → ${returnData.destination}
    </div>`;
    
    if (returnData.flights && returnData.flights.length > 0) {
        html += formatFlights(returnData.flights);
    } else {
        html += '<p>No return flights available. Contact Villers Jets for options.</p>';
    }
    
    html += formatBookingLink(outboundData.affiliate_link);
    
    resultsDiv.innerHTML = html;
}

// Format individual flights
function formatFlights(flights) {
    let html = '';
    
    flights.forEach((flight, index) => {
        const price = flight.price > 0 
            ? `$${flight.price.toLocaleString()}` 
            : 'Request Quote';
        
        html += `
            <div class="jet-flight">
                <h4 style="margin: 0 0 10px 0;">${index + 1}. ${flight.aircraft}</h4>
                <p style="margin: 5px 0;">
                    <strong>Type:</strong> ${flight.aircraft_type}<br>
                    <strong>Passengers:</strong> Up to ${flight.passengers}<br>
                    <strong>Flight Time:</strong> ${flight.flight_time}<br>
                    <strong>Price:</strong> ${price}
                </p>
            </div>
        `;
    });
    
    return html;
}

// Format booking link
function formatBookingLink(affiliateLink) {
    return `
        <div style="text-align: center; margin-top: 20px;">
            <a href="${affiliateLink}" 
               target="_blank" 
               rel="noopener noreferrer"
               class="jet-link">
                🔗 Book Now with Villers Jets →
            </a>
            <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
                💚 Eco-conscious luxury travel
            </p>
        </div>
    `;
}

// Set minimum dates
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    const departureDateInput = document.getElementById('jet-departure-date');
    const returnDateInput = document.getElementById('jet-return-date');
    
    if (departureDateInput) {
        departureDateInput.setAttribute('min', today);
        
        // Update return date minimum when departure date changes
        departureDateInput.addEventListener('change', function() {
            returnDateInput.setAttribute('min', this.value);
            
            // Clear return date if it's before departure date
            if (returnDateInput.value && returnDateInput.value < this.value) {
                returnDateInput.value = '';
            }
        });
    }
    
    if (returnDateInput) {
        returnDateInput.setAttribute('min', today);
    }
});
</script>
